services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legal_service_rails
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: change-owner-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d legal_service_rails"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
