name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legal_service_rails_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legal_service_rails_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/legal_service_rails_test
      CREDENTIAL_DIGILOCKER_MODE: OFF
      CREDENTIAL_BAR_MODE: OFF
      CREDENTIAL_AIBE_MODE: OFF
      CASE_STATUS_MODE: LINK_ONLY
      PAYMENTS_MODE: OFF
      IVR_MODE: OFF
      WHATSAPP_MODE: OFF
      INSTITUTIONAL_EXPORT_MODE: LOCAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run verify
